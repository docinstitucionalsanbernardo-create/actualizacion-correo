<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualización de correo electrónico | I.E. San Bernardo</title>
<style>
  :root{
    --azul: #0B3D66;
    --azul-claro: #1B5D93;
    --verde: #2E7D4F;
    --gris: #5B6470;
    --fondo: #F3F5F7;
    --borde: #D7DEE4;
    --error: #B3261E;
  }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--fondo);
    color:#1C2530;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding: 20px 10px 40px;
  }
  .tarjeta{
    background:#fff;
    width:100%;
    max-width:520px;
    border-radius:10px;
    box-shadow: 0 2px 14px rgba(11,61,102,0.12);
    overflow:hidden;
  }
  @media (max-width: 400px){
    body{ padding: 0; }
    .tarjeta{ border-radius:0; box-shadow:none; min-height:100vh; }
  }
  .encabezado{
    background: linear-gradient(135deg, var(--azul), var(--azul-claro));
    color:#fff;
    padding: 20px 18px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo-circulo{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    background:#fff;
    object-fit:cover;
    border:2px solid rgba(255,255,255,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:1.05rem;
    color: var(--azul);
  }
  .encabezado-texto h1{
    margin:0 0 4px;
    font-size:1.05rem;
    font-weight:700;
    line-height:1.25;
  }
  .encabezado-texto p{
    margin:0;
    font-size:0.8rem;
    opacity:0.9;
    line-height:1.3;
  }
  @media (max-width: 360px){
    .encabezado{ padding:16px 14px; gap:10px; }
    .logo-circulo{ width:44px; height:44px; min-width:44px; font-size:0.9rem; }
    .encabezado-texto h1{ font-size:0.95rem; }
    .encabezado-texto p{ font-size:0.75rem; }
    .cuerpo{ padding:18px 16px; }
  }
  .cuerpo{ padding: 24px; }
  .pasos{
    display:flex;
    gap:6px;
    margin-bottom:20px;
  }
  .paso-dot{
    flex:1;
    height:4px;
    border-radius:3px;
    background: var(--borde);
    transition: background 0.3s;
  }
  .paso-dot.activo{ background: var(--verde); }
  label{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    color: var(--azul);
    margin-bottom:6px;
  }
  input[type=text], input[type=date], input[type=email]{
    width:100%;
    padding:13px 12px;
    border:1.5px solid var(--borde);
    border-radius:7px;
    font-size:16px;
    margin-bottom:16px;
    outline:none;
    transition: border-color 0.15s;
    -webkit-appearance:none;
    appearance:none;
  }
  input:focus{ border-color: var(--azul-claro); }
  button{
    width:100%;
    min-height:48px;
    padding:12px;
    border:none;
    border-radius:7px;
    background: var(--verde);
    color:#fff;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition: opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled{ opacity:0.55; cursor:not-allowed; }
  button:hover:not(:disabled){ opacity:0.9; }
  .mensaje{
    font-size:0.85rem;
    padding:10px 12px;
    border-radius:7px;
    margin-bottom:16px;
    display:none;
  }
  .mensaje.error{ background:#FCEBEA; color:var(--error); display:block; }
  .mensaje.exito{ background:#E8F5EC; color: var(--verde); display:block; }
  .caja-estudiante{
    background: var(--fondo);
    border:1px solid var(--borde);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:18px;
  }
  .caja-estudiante .rotulo{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color: var(--gris);
    margin-bottom:2px;
  }
  .caja-estudiante .nombre{
    font-size:1.05rem;
    font-weight:700;
    color: var(--azul);
  }
  .oculto{ display:none; }
  .pie{
    text-align:center;
    font-size:0.72rem;
    color: var(--gris);
    margin-top:18px;
  }
  .spinner{
    display:inline-block;
    width:14px;height:14px;
    border:2px solid #fff;
    border-top-color:transparent;
    border-radius:50%;
    animation: girar 0.7s linear infinite;
    vertical-align:middle;
    margin-right:6px;
  }
  @keyframes girar{ to{ transform: rotate(360deg); } }
</style>
</head>

    <div class="encabezado-texto">
      <h1>Institución Educativa San Bernardo</h1>
      <p>Actualización de correo electrónico del acudiente</p>
    </div>
  </div>

  <div class="cuerpo">
    <div class="pasos">
      <div class="paso-dot activo" id="dot1"></div>
      <div class="paso-dot" id="dot2"></div>
    </div>

    <div id="mensajeGlobal" class="mensaje"></div>

    <!-- PASO 1: validación de identidad -->
    <form id="formPaso1">
      <label for="documento">Número de documento del estudiante</label>
      <input type="text" id="documento" inputmode="numeric" placeholder="Ej: 1098765432" required>

      <label for="fechaNacimiento">Fecha de nacimiento del estudiante</label>
      <input type="date" id="fechaNacimiento" required>

      <button type="submit" id="btnValidar">Validar estudiante</button>
    </form>

    <!-- PASO 2: registro de correo -->
    <form id="formPaso2" class="oculto">
      <div class="caja-estudiante">
        <div class="rotulo">Va a registrar el correo del estudiante</div>
        <div class="nombre" id="nombreEstudiante">—</div>
      </div>

      <label for="correo">Correo electrónico del acudiente</label>
      <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
      <div id="mensajeCorreo" class="mensaje"></div>

      <button type="submit" id="btnRegistrar">Registrar correo</button>
    </form>

    <div class="pie">Los datos suministrados serán tratados conforme a la Ley 1581 de 2012 de protección de datos personales.</div>
  </div>
</div>

<script>
// ======================================================================
// PEGUE AQUÍ LA URL DE SU IMPLEMENTACIÓN DE GOOGLE APPS SCRIPT (paso 4
// de las instrucciones). Debe terminar en /exec
// ======================================================================
const URL_API = "PEGAR_AQUI_LA_URL_DE_IMPLEMENTACION";

const formPaso1 = document.getElementById('formPaso1');
const formPaso2 = document.getElementById('formPaso2');
const mensajeGlobal = document.getElementById('mensajeGlobal');
const mensajeCorreo = document.getElementById('mensajeCorreo');
const btnValidar = document.getElementById('btnValidar');
const btnRegistrar = document.getElementById('btnRegistrar');
const dot1 = document.getElementById('dot1');
const dot2 = document.getElementById('dot2');

let filaEstudiante = null;

function mostrarMensaje(el, texto, tipo){
  el.textContent = texto;
  el.className = 'mensaje ' + tipo;
}

function ocultarMensaje(el){
  el.className = 'mensaje';
  el.textContent = '';
}

formPaso1.addEventListener('submit', async function(e){
  e.preventDefault();
  ocultarMensaje(mensajeGlobal);

  const documento = document.getElementById('documento').value.trim();
  const fecha = document.getElementById('fechaNacimiento').value; // AAAA-MM-DD

  if(!documento || !fecha){
    mostrarMensaje(mensajeGlobal, 'Por favor complete ambos campos.', 'error');
    return;
  }

  btnValidar.disabled = true;
  btnValidar.innerHTML = '<span class="spinner"></span>Validando...';

  try{
    const resp = await fetch(`${URL_API}?accion=validar&documento=${encodeURIComponent(documento)}&fecha=${encodeURIComponent(fecha)}`);
    const datos = await resp.json();

    if(datos.valido){
      filaEstudiante = datos.fila;
      document.getElementById('nombreEstudiante').textContent = datos.nombre;
      formPaso1.classList.add('oculto');
      formPaso2.classList.remove('oculto');
      dot1.classList.remove('activo');
      dot2.classList.add('activo');
    } else {
      mostrarMensaje(mensajeGlobal, 'El documento y la fecha de nacimiento no coinciden con nuestros registros. Verifique los datos e intente nuevamente.', 'error');
    }
  } catch(err){
    mostrarMensaje(mensajeGlobal, 'No fue posible conectar con el sistema. Intente más tarde.', 'error');
  } finally {
    btnValidar.disabled = false;
    btnValidar.textContent = 'Validar estudiante';
  }
});

formPaso2.addEventListener('submit', async function(e){
  e.preventDefault();
  ocultarMensaje(mensajeCorreo);

  const correo = document.getElementById('correo').value.trim();
  const regexCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  if(!regexCorreo.test(correo)){
    mostrarMensaje(mensajeCorreo, 'Ingrese un correo electrónico válido (ejemplo: nombre@dominio.com).', 'error');
    return;
  }

  btnRegistrar.disabled = true;
  btnRegistrar.innerHTML = '<span class="spinner"></span>Registrando...';

  try{
    const resp = await fetch(`${URL_API}?accion=registrar&fila=${filaEstudiante}&correo=${encodeURIComponent(correo)}`);
    const datos = await resp.json();

    if(datos.exito){
      formPaso2.classList.add('oculto');
      mostrarMensaje(mensajeGlobal, '✔ Correo registrado correctamente. Gracias por actualizar la información.', 'exito');
    } else {
      mostrarMensaje(mensajeCorreo, datos.mensaje || 'No fue posible registrar el correo.', 'error');
    }
  } catch(err){
    mostrarMensaje(mensajeCorreo, 'No fue posible conectar con el sistema. Intente más tarde.', 'error');
  } finally {
    btnRegistrar.disabled = false;
    btnRegistrar.textContent = 'Registrar correo';
  }
});
</script>

</body>
</html>
